<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e3d7ba">
<meta name="color-scheme" content="only light">
<title>Диспетчер · Małkinia</title>
<style>
:root{
  --desk:#2a241e;--desk2:#1d1915;--paper:#e9dfc7;--paper2:#d9ccab;--ink:#2b2620;--ink2:#5a5146;
  --olive:#5e6b45;--brick:#8a4a3c;
  --mono:"Courier Prime","Courier New",Courier,monospace;--serif:Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .11 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--desk2);color:var(--paper);font-family:var(--mono)}
body{overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:var(--mono);cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 35%,#3b3229 0%,#241f1a 60%,#17130f 100%)}
.app.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}

/* paper */
.paper{background-color:var(--paper);background-image:var(--noise),linear-gradient(180deg,#efe6cf 0%,#e6dabe 100%);color:var(--ink);box-shadow:0 10px 28px #000a,0 1px 0 #fff4 inset}

/* start */
#start{align-items:center;justify-content:flex-start;padding:20px 12px;overflow-y:auto}
#start .order{margin:auto 0}
.order{width:100%;padding:24px 16px 22px;font-size:17px;line-height:1.45}
.order .hd{font-size:17px;letter-spacing:.06em;text-align:center;border-bottom:1px solid var(--ink2);padding-bottom:8px;margin-bottom:12px}
.order .hd b{display:block;font-size:22px;letter-spacing:.14em;margin-bottom:2px}
.order h2{font-size:21px;letter-spacing:.18em;text-align:center;margin:4px 0 12px}
.order ol{padding-left:30px;margin-bottom:18px}
.order li{margin-bottom:10px}
.order label{display:block;font-size:17px;font-weight:bold;letter-spacing:.08em;margin-bottom:4px;color:var(--ink)}
.order input{width:100%;font-family:var(--mono);font-size:22px;padding:8px 2px;background:transparent;border:0;border-bottom:2px solid var(--ink);color:var(--ink);outline:none;border-radius:0}
.order input::placeholder{color:#8a7e6a}
.go{margin-top:20px;width:100%;height:60px;font-weight:bold;font-size:19px;letter-spacing:.14em;background:var(--ink);color:var(--paper);border:0}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 14px 9px;padding-top:max(10px,env(safe-area-inset-top));background:#15120fcc;border-bottom:1px solid #000;position:relative;z-index:5}
.purse{flex:1;min-width:0}
.coins{display:flex;flex-wrap:wrap;gap:3px;min-height:12px}
.coin{width:11px;height:11px;border-radius:50%;background:#a8843f}
.coin.gone{animation:gone .9s forwards}
.coin.new{animation:pop .55s}
@keyframes gone{30%{filter:grayscale(1) brightness(.7)}100%{opacity:0;transform:translateY(-9px) scale(.3);filter:grayscale(1)}}
@keyframes pop{0%{transform:scale(0) translateY(10px)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
.zl{font-size:13px;color:#d8c9a6;margin-top:4px;letter-spacing:.04em}
.zl.low{color:#e08a76;animation:blink 1s steps(2,end) infinite}
.coins.low .coin{background:var(--brick);box-shadow:none;animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.35}}
.rep{text-align:right}
.rep small{display:block;font-size:10px;letter-spacing:.14em;color:#a99c83;margin-bottom:4px}
.slots{display:flex;gap:5px;justify-content:flex-end}
.slot{width:15px;height:19px;border:1px solid #9b8e74}
.slot.on{background:var(--brick);border-color:#b06a59;animation:pop .4s}
.firedtag{display:none;margin-top:5px;font-size:10px;letter-spacing:.16em;color:#e2b2a5;border:1px solid var(--brick);padding:1px 5px}
.firedtag.on{display:inline-block}

/* bills */
.bills{position:absolute;left:0;right:0;top:62px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.bill{min-width:220px;padding:7px 12px;font-size:12.5px;display:flex;justify-content:space-between;gap:14px;transform:translateY(-140%);opacity:0;transition:transform .35s,opacity .35s}
.bill.on{transform:none;opacity:1}
.bill b{color:var(--brick)}
.bill i{font-style:normal;font-size:10px;letter-spacing:.12em;color:var(--ink2);display:block}

/* desk & blank */
.desk{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0;position:relative;-webkit-overflow-scrolling:touch;background-color:var(--paper);background-image:var(--noise),linear-gradient(180deg,#efe6cf 0%,#e6dabe 100%)}
.desk .blank{box-shadow:none;background:transparent;min-height:100%;padding:16px 14px 24px}
.blank{position:relative;padding:16px 14px 18px;font-size:17px;line-height:1.4;transition:transform .55s cubic-bezier(.5,0,.6,1),opacity .55s}
.blank.in{animation:slidein .45s cubic-bezier(.2,.7,.3,1)}
.blank.out{transform:translateX(-125%) rotate(-5deg);opacity:.2}
@keyframes slidein{from{transform:translateX(110%) rotate(4deg)}to{transform:none}}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;line-height:1.3}
.bh .st{font-weight:bold;font-size:17px;letter-spacing:.08em;white-space:nowrap}
.bh .bn{font-size:15px;white-space:nowrap}
.dir{margin:10px -14px 10px;padding:8px 14px;font-weight:bold;letter-spacing:.12em;font-size:18.5px;display:flex;align-items:center;gap:10px}
.dir .ar{font-size:18px;line-height:1}
.dir.arr{background:#d3c6a2;color:var(--ink);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.dir.dep{background:var(--ink);color:var(--paper);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.dir small{font-weight:normal;letter-spacing:.06em;font-size:13px;opacity:.8}
table.w{width:100%;border-collapse:collapse;font-size:17px}
table.w th{font-weight:normal;color:#9a8f78;font-size:13px;letter-spacing:.1em;text-align:left;border-bottom:1px solid var(--ink);padding:2px 4px 4px}
table.w td{padding:9px 4px;border-bottom:1px dotted #8f846e;vertical-align:baseline}
table.w td .q{margin-left:8px;font-size:14px;color:var(--ink2);white-space:nowrap}
table.w td.n{width:30px;text-align:right;padding-right:8px}
table.w td.t{width:92px;white-space:nowrap}
table.w tr.ppl td{background:#8a4a3c26}
table.w tr.ppl td .q{color:var(--brick);font-weight:bold}
.note b{color:var(--ink)}
.note{margin-top:10px;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.stampzone{position:relative;height:96px;margin-top:12px}
.slotlbl{position:absolute;right:2px;top:8px;width:190px;height:70px;border:1px dashed #9a8f78;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.12em;color:#9a8f78}

/* stamp */
.stamp{position:absolute;right:0;top:8px;width:196px;border:3px double currentColor;padding:6px 8px 5px;text-align:center;font-weight:bold;opacity:.86;transform:rotate(var(--r));filter:url(#ink);mix-blend-mode:multiply;z-index:2;pointer-events:none}
.stamp .s1{font-size:21px;letter-spacing:.14em;line-height:1.15}
.stamp .s2{font-size:13px;letter-spacing:.05em;border-top:1.5px solid currentColor;margin-top:3px;padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stamp.ok{color:var(--olive)}
.stamp.no{color:var(--brick)}
.stamp.hit{animation:hit .32s cubic-bezier(.3,1.4,.6,1)}
@keyframes hit{0%{transform:rotate(var(--r)) scale(1.9);opacity:0}100%{transform:rotate(var(--r)) scale(1);opacity:.86}}

/* bottom */
.bot{background:#14110e;border-top:1px solid #000;padding:9px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));position:relative;z-index:5}
.r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat{font-size:10.5px;letter-spacing:.08em;color:#a99c83;line-height:1.2}
.stat b{display:block;font-size:17px;color:var(--paper);letter-spacing:.02em;margin-top:2px}
.stat b.over{color:#e0a090}
.stat.big b{font-size:28px;line-height:1;color:#f3ead6}
.stat.big b.over{color:#e8957f}
.stepper{display:flex;align-items:center;border:1px solid #5d5345}
.stepper button{width:44px;height:44px;font-size:22px;background:#221d18;color:var(--paper);border:0}
.stepper button:active{background:#3a3129}
.stepper .v{width:42px;text-align:center;font-size:22px;font-weight:bold}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}
.btn{height:52px;font-weight:bold;letter-spacing:.12em;font-size:15px;border:2px solid;background:transparent}
.btn.ok{color:#c3cca5;border-color:var(--olive);background:#5e6b452e}
.btn.no{color:#ddaa9c;border-color:var(--brick);background:#8a4a3c2e}
.btn:active{filter:brightness(1.3)}
.btn:disabled,.stepper button:disabled{opacity:.45}

/* modal */
.modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:60;padding:26px}
.modal.on{display:flex}
.card{width:100%;max-width:320px;padding:18px 18px 16px;animation:drop .3s cubic-bezier(.2,1.3,.5,1)}
@keyframes drop{from{transform:translateY(-30px) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.card .ch{font-size:10.5px;letter-spacing:.1em;color:var(--ink2);border-bottom:1px solid var(--ink2);padding-bottom:6px;margin-bottom:12px}
.card h3{color:var(--brick);font-size:20px;letter-spacing:.16em;margin-bottom:10px}
.card p{font-size:14.5px;line-height:1.45;margin-bottom:16px}
.card button{width:100%;height:46px;background:var(--ink);color:var(--paper);border:0;font-weight:bold;letter-spacing:.12em;font-size:14px}

/* end overlay */
.dark{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.4s;z-index:40}
.dark.on{opacity:1}

/* final */
#final{overflow-y:auto;padding:24px 16px 40px;padding-top:max(24px,env(safe-area-inset-top));background:#0f0d0b}
.f{opacity:0;transform:translateY(6px);transition:opacity .9s,transform .9s}
.f.on{opacity:1;transform:none}
.report{padding:18px 16px;font-size:13.5px;line-height:1.7;margin-bottom:26px}
.report h2{font-size:14px;letter-spacing:.2em;text-align:center;border-bottom:1px solid var(--ink2);padding-bottom:8px;margin-bottom:10px}
.report .ln{display:flex;justify-content:space-between;gap:10px}
.report .ln b{white-space:nowrap}
.truth{font-family:var(--sans);font-size:18px;line-height:1.55;color:#efe5cf;margin:6px 4px 22px}
.truth em{font-style:normal;color:#e0a596}
.moral{font-family:var(--sans);font-size:17px;line-height:1.6;color:#ddd3bd;border-left:2px solid #5a5146;padding:4px 0 4px 14px;margin:0 4px 26px}
.moral strong{display:block;margin-top:12px;font-size:21px;color:#f3ead6;font-weight:600}
.sec{font-size:11px;letter-spacing:.18em;color:#8f846e;margin:0 4px 10px}
.hint{font-size:11px;color:#8f846e;margin:0 4px 26px}
.archbtn{margin:0 0 30px;border-color:#8a4a3c;color:#ecc3b7;background:#8a4a3c22;font-size:13px;line-height:1.3;height:auto;min-height:56px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}
.archbtn span{flex:none;min-width:30px;height:30px;border-radius:15px;background:var(--brick);color:#f3e4dc;display:flex;align-items:center;justify-content:center;font-size:14px}
.archov{position:absolute;inset:0;z-index:55;background:#0f0d0b;display:none;flex-direction:column;padding:16px 16px 10px;padding-top:max(16px,env(safe-area-inset-top))}
.archov.on{display:flex}
.archhd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:12px;letter-spacing:.16em;color:#d8c9a6;line-height:1.5;margin-bottom:14px}
.archhd button{flex:none;width:44px;height:44px;background:transparent;border:1px solid #5d5345;color:var(--paper);font-size:18px}
.archov .arch{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;overflow-y:auto;overflow-x:hidden;margin:0 -16px;padding:0 16px 20px;scroll-snap-type:none}
.archov .arch .blank{flex:none}
.hh{font-family:var(--sans);font-size:18px;font-weight:700;color:#f3ead6;margin:0 4px 12px;padding-top:16px;border-top:1px solid #3a332b}
.sh{font-family:var(--sans);font-size:18px;font-weight:600;color:#d8c9a6;margin:0 4px 8px}
.hist{font-family:var(--sans);font-size:18px;line-height:1.6;color:#d8cdb6;margin:0 4px 12px;padding-left:18px}
.hist li{margin-bottom:10px}
.hist .q{display:block;margin-top:6px;font-size:18px;color:#f3ead6}
.src{font-family:var(--sans);font-size:18px;line-height:1.5;color:#8f846e;margin:0 4px 28px;padding-left:18px}
.src li{margin-bottom:8px}
.src a{color:#b8a98b}
.again{width:100%;height:50px;background:transparent;color:var(--paper);border:1px solid #5d5345;font-weight:bold;letter-spacing:.14em;font-size:14px}


/* ---------- light theme only (phone & desktop) ---------- */
:root{color-scheme:only light}
html,body{background:#cfc2a0;color:var(--ink)}
.app{background:#cfc2a0}
.top{background:#e3d7ba;border-bottom:1px solid #b9ab8a}
.zl{color:var(--ink2)}.zl.low{color:var(--brick)}
.rep small{color:var(--ink2)}
.slot{border-color:var(--ink2)}
.firedtag{color:var(--brick)}
.bot{background:#ddd0b0;border-top:1px solid #b9ab8a}
.stat{color:var(--ink2)}.stat b{color:var(--ink)}.stat b.over,.stat.big b.over{color:var(--brick)}
.stat.big b{color:var(--ink)}
.stepper{border-color:#9a8f78}
.stepper button{background:#e9dfc7;color:var(--ink)}.stepper button:active{background:#d3c6a2}
.stepper{background:#e9dfc7}
.stepper .v{color:var(--ink);background:transparent;align-self:stretch;display:flex;align-items:center;justify-content:center}
.btn.ok{color:#3f4a2c;border-color:var(--olive);background:#5e6b4522}
.btn.no{color:#6e3226;border-color:var(--brick);background:#8a4a3c1c}
.modal{background:#2b262080}
.dark{background:#e9dfc7}
#final{background-color:var(--paper);background-image:var(--noise),linear-gradient(180deg,#efe6cf 0%,#e6dabe 100%)}
.report{box-shadow:none;border:1px solid #b9ab8a}
.truth{color:var(--ink)}.truth em{color:var(--brick)}
.archbtn{color:#6e3226;background:#8a4a3c18;border-color:var(--brick)}
.archbtn span{color:var(--paper)}
.archov{background:#d9ccab}
.archhd{color:var(--ink)}.archhd button{border-color:var(--ink2);color:var(--ink)}
.archov .blank{box-shadow:0 4px 14px #0003}
.hh{color:var(--ink);border-top-color:#b9ab8a}
.sh{color:var(--ink2)}
.hist{color:var(--ink)}.hist .q{color:var(--ink)}
.src{color:var(--ink2)}.src a{color:var(--brick)}
.again{color:var(--ink);border-color:var(--ink2)}
#start .order{box-shadow:0 6px 20px #0002}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G" result="d"/><feComponentTransfer in="n" result="m"><feFuncA type="discrete" tableValues="1 1 1 1 1 1 0 1 1 1"/></feComponentTransfer><feComposite in="d" in2="m" operator="in"/></filter>
</svg>

<div class="app" id="app">

  <!-- START -->
  <section class="screen on" id="start">
    <div class="order paper">
      <div class="hd"><b>STACJA MAŁKINIA</b>plac Jana Matejki 12</div>
      <h2>ВХІД НА ЗМІНУ</h2>
      <ol id="rules"></ol>
      <label for="name">ПРІЗВИЩЕ ДИСПЕТЧЕРА</label>
      <input id="name" maxlength="22" autocomplete="off" spellcheck="false" value="Walter Stier">
      <button class="go" id="go">РОЗПОЧАТИ ЗМІНУ</button>
    </div>
  </section>

  <!-- GAME -->
  <section class="screen" id="game">
    <div class="top">
      <div class="purse"><div class="coins" id="coins"></div><div class="zl" id="zl"></div></div>
      <div class="rep"><small>ДОГАНИ</small><div class="slots" id="slots"></div><span class="firedtag" id="firedtag">ЗВІЛЬНЕНО</span></div>
    </div>
    <div class="bills" id="bills"></div>
    <div class="desk" id="desk"></div>
    <div class="bot">
      <div class="r1">
        <div class="stat">ПОТЯГ<b id="tn">1 / 10</b></div>
        <div class="stat big">НА СТАНЦІЇ<b id="sn">80 / 100</b></div>
        <div class="stepper">
          <button id="minus" aria-label="менше">−</button>
          <div class="v" id="cnt">0</div>
          <button id="plus" aria-label="більше">+</button>
        </div>
      </div>
      <div class="r2">
        <button class="btn ok" id="ok">СХВАЛЕНО</button>
        <button class="btn no" id="no">ВІДХИЛЕНО</button>
      </div>
    </div>
  </section>

  <!-- FINAL -->
  <section class="screen" id="final"></section>

  <div class="archov" id="archov">
    <div class="archhd"><span>ПІДПИСАНІ БЛАНКИ<br>З ЛЮДЬМИ НА СТРАТУ</span><button id="archx" aria-label="закрити">✕</button></div>
    <div class="arch" id="arch"></div>
    
  </div>
  <div class="dark" id="dark"></div>
  <div class="modal" id="modal"><div class="card paper"><div class="ch">STACJA MAŁKINIA · ЗАВІДУВАЧ СТАНЦІЇ</div><h3 id="mt"></h3><p id="mp"></p><button id="mb">ОЗНАЙОМЛЕНИЙ</button></div></div>
</div>

<script>
(function(){
"use strict";

/* ---------- params ---------- */
const Q = new URLSearchParams(location.search);
function num(k, d, lo, hi){ let v = parseFloat(Q.get(k)); if(!isFinite(v)) v = d; if(lo!=null) v = Math.max(lo, v); if(hi!=null) v = Math.min(hi, v); return Math.round(v); }
const P = {
  cars: num('cars', 8, 5, 20),
  start: num('start', 80, 0, 5000),
  limit: num('limit', 100, 1, 5000),
  trains: num('trains', 10, 1, 60),
  safe: num('safe', 3, 0, 60),
  peopleMin: num('peopleMin', 3, 0, 100),
  peopleMax: num('peopleMax', 5, 0, 100),
  pplMin: num('pplMin', 100, 1, 1000),
  pplMax: num('pplMax', 150, 1, 1000),
  overflow: num('overflow', 1, 0, 1),
  overflowFrom: num('overflowFrom', 5, 1, 60),
  strikes: num('strikes', 3, 1, 20),
  coins: num('coins', 20, 0, 500),
  drain: Math.max(1, parseFloat(Q.get('drain')) || 11),
  bonus: num('bonus', 5, 0, 500),
  bonusMax: num('bonusMax', 1, 0, 20),
  sound: num('sound', 1, 0, 1)
};
if (P.peopleMax < P.peopleMin) P.peopleMax = P.peopleMin;
if (P.pplMax < P.pplMin) P.pplMax = P.pplMin;

/* ---------- seeded rng ---------- */
function hashStr(s){ let h = 1779033703 ^ s.length; for (let i=0;i<s.length;i++){ h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; } return h>>>0; }
const seedStr = Q.get('seed');
let seed = seedStr ? hashStr(seedStr) : (Math.random()*4294967296)>>>0;
function R(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1 | seed); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14)>>>0) / 4294967296; }
const ri = (a,b) => a + Math.floor(R()*(b-a+1));
const pick = a => a[Math.floor(R()*a.length)];
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j = Math.floor(R()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n.toLocaleString('uk-UA');

/* ---------- sound ---------- */
let AC = null, soundOn = !!P.sound;
function ac(){ if(!soundOn) return null; if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(AC.state==='suspended') AC.resume(); return AC; }
function noiseSrc(a, dur){ const b = a.createBuffer(1, Math.max(1, a.sampleRate*dur|0), a.sampleRate); const d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; const s = a.createBufferSource(); s.buffer = b; return s; }
function env(g, t, att, dec, peak){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t+att); g.gain.exponentialRampToValueAtTime(0.0001, t+att+dec); }
function tone(a, type, f0, f1, t, att, dec, peak){ const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); if(f1) o.frequency.exponentialRampToValueAtTime(f1, t+att+dec); env(g, t, att, dec, peak); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+att+dec+.05); }
function burst(a, t, dur, ftype, freq, q, att, dec, peak){ const n = noiseSrc(a, dur), f = a.createBiquadFilter(), g = a.createGain(); f.type = ftype; f.frequency.value = freq; if(q) f.Q.value = q; env(g, t, att, dec, peak); n.connect(f); f.connect(g); g.connect(a.destination); n.start(t); }
const SND = {
  thud(){ const a = ac(); if(!a) return; const t = a.currentTime; tone(a,'sine',150,42,t,.004,.24,.9); burst(a,t,.14,'lowpass',1100,0,.002,.09,.55); burst(a,t+.01,.05,'bandpass',2600,1.2,.001,.03,.18); },
  coin(){ const a = ac(); if(!a) return; const t = a.currentTime; tone(a,'sine',1980,0,t,.003,.22,.14); tone(a,'sine',2640,0,t+.07,.003,.3,.12); tone(a,'triangle',3960,0,t+.07,.003,.12,.04); },
  paper(){ const a = ac(); if(!a) return; const t = a.currentTime; burst(a,t,.3,'bandpass',3200,.6,.05,.22,.2); burst(a,t+.12,.2,'highpass',5000,0,.02,.12,.08); },
  alarm(){ const a = ac(); if(!a) return; const t = a.currentTime; tone(a,'square',196,0,t,.01,.38,.09); tone(a,'square',207,0,t,.01,.38,.07); SND.thud(); },
  clack(){ const a = ac(); if(!a) return; const t = a.currentTime; for (let k=0;k<6;k++){ const tt = t + k*.17; burst(a,tt,.06,'lowpass',1400,0,.002,.05,.28); burst(a,tt+.055,.06,'lowpass',1200,0,.002,.05,.2); } },
  whistle(){ const a = ac(); if(!a) return; const t = a.currentTime;
    [[880,.1],[1318,.05]].forEach(([f,p]) => { const o = a.createOscillator(), g = a.createGain(), l = a.createOscillator(), lg = a.createGain();
      o.type='sine'; o.frequency.value=f; l.frequency.value=5.5; lg.gain.value=f*.012; l.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p,t+.15); g.gain.setValueAtTime(p,t+1.1); g.gain.exponentialRampToValueAtTime(.0001,t+1.9);
      o.connect(g); g.connect(a.destination); o.start(t); l.start(t); o.stop(t+2); l.stop(t+2); }); }
};
function vib(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* ---------- data ---------- */
const BILLS = [
  {n:'Хліб', c:1, w:3}, {n:'Газ для лампи', c:1, w:2}, {n:'Мило', c:1, w:2},
  {n:'Вугілля', c:2, w:2}, {n:'Ліки для доньки', c:2, w:1}, {n:'Оренда кімнати', c:3, w:1},
  {n:'Молоко', c:1, w:3}, {n:'Свічки', c:1, w:2}, {n:'Зошити для доньки', c:1, w:2},
  {n:'Дрова', c:2, w:2}, {n:'Ремонт черевиків', c:2, w:1}, {n:'Податок', c:3, w:1}
];
const CARGO = {
  'ПВ': [{c:'пустий'}, {c:'пустий'}, {c:'Військові', u:'ppl', a:30, b:60}],
  'ТВ': [{c:'Вугілля', u:'т', a:20, b:60}, {c:'Зерно', u:'т', a:15, b:40}, {c:'Ліс', u:'шт', a:40, b:90}, {c:'Цегла', u:'pal', a:20, b:48}, {c:'Цемент', u:'т', a:15, b:30}],
  'ВЦ': [{c:'Нафта', u:'т', a:18, b:25}, {c:'Спирт', u:'т', a:10, b:20}, {c:'пустий'}]
};
function plural(n, one, few, many){ const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return one; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few; return many; }
function qtyText(w){
  if (w.q == null) return '';
  if (w.u === 'ppl') return `${w.q} ${plural(w.q,'особа','особи','осіб')}`;
  if (w.u === 'pal') return `${w.q} ${plural(w.q,'палета','палети','палет')}`;
  return `${w.q} ${w.u}`;
}
function mkWagon(t, cg){ const w = { t, no:ri(1000,9999), cargo:cg.c, u:cg.u, q: cg.u ? ri(cg.a, cg.b) : null, ppl:0 }; return w; }
const MIL = CARGO['ПВ'][2];
const REASONS = { count: 'Невірна кількість вагонів.', over: 'Переповнення станції.', delay: 'Безпідставна затримка потяга.' };

/* people plan: which trains carry people wagons, and how many */
const peoplePlan = new Array(P.trains).fill(0);
(function(){
  const elig = []; for (let i=P.safe;i<P.trains;i++) elig.push(i);
  let total = ri(P.peopleMin, P.peopleMax);
  if (!elig.length || total <= 0) return;
  const cap = Math.min(4, P.cars);
  const k = Math.min(ri(2,4), elig.length, total);
  const chosen = shuffle(elig.slice()).slice(0, k);
  chosen.forEach(i => peoplePlan[i] = 1); total -= k;
  let guard = 500;
  while (total > 0 && guard--) { const i = pick(chosen); if (peoplePlan[i] < cap) { peoplePlan[i]++; total--; } }
})();

/* ---------- state ---------- */
const G = { name:'', idx:-1, cur:null, count:0, station:P.start, coins:P.coins, earned:0, strikes:0, fired:false,
  overflowLeft:P.overflow, warned:0, busy:true, over:false, archive:[], signedW:0, signedP:0, billT:null, blankNo:ri(300,700) };

/* ---------- generator ---------- */
function genTrain(i){
  const s = G.station, room = P.limit - s, pw = peoplePlan[i];
  const minN = Math.max(5, pw);
  let dir, n;
  const ovWindow = G.overflowLeft > 0 && i >= P.overflowFrom - 1;
  const ovMin = Math.max(minN, room + 1);
  const ovPossible = ovWindow && room >= 0 && ovMin <= P.cars;
  const late = i >= P.trains - 2;
  if (ovPossible && (R() < .5 || late)) { dir = 'arr'; n = ri(ovMin, P.cars); G.overflowLeft--; }
  else {
    const maxFit = Math.min(P.cars, room);
    let wantArr = maxFit >= minN && R() < (ovWindow ? .8 : .6);
    if (!wantArr && s < minN && maxFit >= minN) wantArr = true;
    if (wantArr) { dir = 'arr'; n = ri(minN, maxFit); }
    else { dir = 'dep'; n = ri(minN, Math.max(minN, Math.min(P.cars, s))); if (n > s) n = Math.max(minN, s); }
  }
  const ppl = [];
  for (let k=0;k<pw;k++) { const q = ri(P.pplMin, P.pplMax); ppl.push({ t:'ТВ', no:ri(1000,9999), cargo:'Переселенці', u:'ppl', q, ppl:q }); }
  const needMil = pw > 0 || i === 0;
  const other = [];
  while (other.length < n - pw - (needMil ? 1 : 0)) { const t = pick(['ПВ','ТВ','ТВ','ТВ','ВЦ']); other.push(mkWagon(t, pick(CARGO[t]))); }
  shuffle(other);
  let wag;
  if (i === 0) {
    const mil = mkWagon('ПВ', MIL);
    const first = other.find(w => w.cargo !== 'Військові') || other[0];
    const rest = shuffle(ppl.concat(other.filter(w => w !== first)));
    wag = first ? [first, mil].concat(rest) : [mil].concat(rest);
  } else {
    wag = shuffle(ppl.concat(other, needMil ? [mkWagon('ПВ', MIL)] : []));
    if (wag[0].ppl) { const k = wag.findIndex(w => !w.ppl); [wag[0], wag[k]] = [wag[k], wag[0]]; }
  }
  const gaps = R() < .25 ? 0 : ri(1,3), gapAt = new Set();
  while (gapAt.size < Math.min(gaps, n-1)) gapAt.add(ri(1, n-1));
  let cur = 1; wag.forEach((w,k) => { if (k>0 && gapAt.has(k)) cur++; w.idx = cur++; });
  return { i, dir, n, wag, trainNo: ri(1000,9999), blankNo: G.blankNo + i,
    peopleW: pw, people: wag.reduce((a,w) => a + w.ppl, 0), result:null };
}

/* ---------- render ---------- */
function renderBlank(t, reveal){
  const d = document.createElement('div');
  d.className = 'blank paper';
  const dir = t.dir === 'arr'
    ? '<div class="dir arr"><span class="ar">▼</span>ПРИБУТТЯ <small>· PRZYJAZD</small></div>'
    : '<div class="dir dep"><span class="ar">▲</span>ВІДПРАВЛЕННЯ <small>· ODJAZD</small></div>';
  const rows = t.wag.map(w => {
    const p = reveal && w.ppl ? ' class="ppl"' : '';
    const q = qtyText(w);
    return `<tr${p}><td class="n">${w.idx}</td><td class="t"><b>${w.t}</b>-${w.no}</td><td class="c">${w.cargo}${q ? `<span class="q">${q}</span>` : ''}</td></tr>`;
  }).join('');
  d.innerHTML =
    `<div class="bh"><span class="st">STACJA MAŁKINIA</span><span class="bn">БЛАНК № ${String(t.blankNo).padStart(4,'0')}</span></div>
     ${dir}
     <table class="w"><thead><tr><th style="text-align:right;padding-right:10px">№</th><th>ВАГОН</th><th>ВАНТАЖ</th></tr></thead><tbody>${rows}</tbody></table>
     <div class="note">Примітка: <b>ПВ</b> — пасажирський, <b>ТВ</b> — товарний, <b>ВЦ</b> — вагон-цистерна.</div>
     <div class="stampzone">${t.result ? '' : '<div class="slotlbl">МІСЦЕ ДЛЯ ШТАМПА</div>'}</div>`;
  if (t.result) d.querySelector('.stampzone').appendChild(makeStamp(t.result === 'ok', t.rot));
  return d;
}
function makeStamp(ok, rot){
  const s = document.createElement('div');
  s.className = 'stamp ' + (ok ? 'ok' : 'no');
  s.style.setProperty('--r', rot + 'deg');
  s.innerHTML = `<div class="s1">${ok ? 'СХВАЛЕНО' : 'ВІДХИЛЕНО'}</div><div class="s2">Dysp. ${esc(G.name)}</div>`;
  return s;
}
function renderCoins(mode, k){
  const box = $('coins'); const show = Math.min(G.coins, 40);
  let h = ''; for (let i=0;i<show;i++) h += `<span class="coin${mode==='new' && i>=show-k ? ' new' : ''}"></span>`;
  box.innerHTML = h;
  const zl = $('zl'); zl.textContent = `${fmt(G.coins*10)} zł` + (G.coins > 40 ? ` · ${G.coins} мон.` : '');
  zl.classList.toggle('low', G.coins <= lowLine); box.classList.toggle('low', G.coins <= lowLine);
}
function renderSlots(){ let h=''; for (let i=0;i<P.strikes;i++) h += `<span class="slot${i<G.strikes?' on':''}"></span>`; $('slots').innerHTML = h; }
function renderBar(){
  $('tn').textContent = `${Math.min(G.idx+1, P.trains)} / ${P.trains}`;
  const sn = $('sn'); sn.textContent = `${G.station} / ${P.limit}`; sn.classList.toggle('over', G.station > P.limit);
  $('cnt').textContent = G.count;
  $('minus').disabled = G.busy || G.count <= 0; $('plus').disabled = G.busy || G.count >= P.cars + 3;
  $('ok').disabled = $('no').disabled = G.busy;
}

/* ---------- modal queue ---------- */
const MQ = []; let modalOpen = false; const idleCbs = [];
function modal(title, text, btn, fx){ MQ.push({title, text, btn, fx}); if (!modalOpen) nextModal(); }
function nextModal(){
  const m = MQ.shift();
  if (!m) { modalOpen = false; $('modal').classList.remove('on'); while (idleCbs.length) idleCbs.shift()(); return; }
  modalOpen = true; $('mt').textContent = m.title; $('mp').textContent = m.text; $('mb').textContent = m.btn || 'ОЗНАЙОМЛЕНИЙ';
  const mo = $('modal'); mo.classList.remove('on'); void mo.offsetWidth; mo.classList.add('on');
  if (m.fx) m.fx();
}
function whenIdle(cb){ if (!modalOpen) cb(); else idleCbs.push(cb); }
$('mb').addEventListener('click', () => nextModal());

/* ---------- strikes, firing ---------- */
function shake(){ const a = $('app'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); }
function strike(reason, txt){
  G.strikes++; renderSlots();
  modal(`ДОГАНА ${G.strikes} / ${P.strikes}`, txt || REASONS[reason], 'ОЗНАЙОМЛЕНИЙ', () => { SND.alarm(); vib(200); shake(); });
  if (G.strikes >= P.strikes) fire();
}
function fire(){
  if (G.fired) return; G.fired = true; $('firedtag').classList.add('on');
  modal('НАКАЗ ПРО ЗВІЛЬНЕННЯ', 'Здайте зміну до кінця.', 'ЗРОЗУМІВ', () => { SND.thud(); setTimeout(SND.thud, 180); vib([200,90,200]); shake(); });
}

/* ---------- money warning ---------- */
const lowLine = Math.max(1, Math.ceil(P.coins * 0.3));
function checkMoney(){
  if (G.warned >= 2) return;
  if (G.warned === 0 && G.coins <= lowLine) { G.warned = 1; warn('Гроші закінчуються. Працюйте швидше.'); }
  else if (G.warned === 1 && G.coins <= 0) { G.warned = 2; warn('Грошей не лишилося. Працюйте швидше.'); }
}
function warn(t){ modal('ПОПЕРЕДЖЕННЯ', t, 'ЗРОЗУМІВ', () => { SND.alarm(); vib([120,80,120]); shake(); }); }

/* ---------- bills ---------- */
function billInterval(){ return P.drain; }
function scheduleBill(){ clearTimeout(G.billT); if (G.over) return; G.billT = setTimeout(() => { bill(); scheduleBill(); }, billInterval()*1000); }
function bill(){
  if (G.over || G.coins <= 0) return;
  const tot = BILLS.reduce((a,b) => a+b.w, 0); let r = Math.random()*tot, b = BILLS[0];
  for (const x of BILLS) { if ((r -= x.w) < 0) { b = x; break; } }
  const paid = Math.min(b.c, G.coins);
  const el = document.createElement('div'); el.className = 'bill paper';
  el.innerHTML = `<span><i>РАХУНОК</i>${b.n}</span><b>−${paid*10} zł</b>`;
  $('bills').appendChild(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  SND.paper();
  setTimeout(() => { el.classList.remove('on'); setTimeout(() => el.remove(), 400); }, 2200);
  if (paid) {
    const coins = $('coins').children; const show = Math.min(G.coins, 40);
    for (let k=0;k<paid && show-1-k>=0;k++) coins[show-1-k].classList.add('gone');
    G.coins -= paid;
    setTimeout(() => renderCoins(), 900);
    $('zl').textContent = `${fmt(G.coins*10)} zł`;
    $('zl').classList.toggle('low', G.coins <= lowLine); $('coins').classList.toggle('low', G.coins <= lowLine);
    checkMoney();
  }
}

/* ---------- flow ---------- */
function nextTrain(){
  G.idx++;
  if (G.idx >= P.trains) return endShift();
  G.cur = genTrain(G.idx); G.count = G.cur.wag[G.cur.wag.length-1].idx;
  const desk = $('desk'); desk.innerHTML = ''; desk.scrollTop = 0;
  const b = renderBlank(G.cur, false); b.classList.add('in'); b.id = 'curBlank'; desk.appendChild(b);
  G.busy = false; renderBar();
}
function decide(approve){
  if (G.busy || G.over) return; G.busy = true; renderBar();
  const t = G.cur, x = G.count, s = G.station, hp = t.peopleW > 0;
  let reason = null, coin = false;
  if (approve) {
    if (t.dir === 'arr') { const fits = s + t.n <= P.limit; if (!fits && !hp) reason = 'over'; else if (x !== t.n) reason = 'count'; G.station += t.n; }
    else { if (x !== t.n) reason = 'count'; G.station -= t.n; }
    coin = true;
    if (hp) { G.signedW += t.peopleW; G.signedP += t.people; }
  } else if (!hp) {
    if (t.dir === 'dep' || s + t.n <= P.limit) reason = 'delay';
  }
  t.result = approve ? 'ok' : 'no'; t.rot = (Math.random()*16 - 8).toFixed(1);
  G.archive.push(t);
  const blank = $('curBlank'); const lbl = blank.querySelector('.slotlbl'); if (lbl) lbl.remove();
  const st = makeStamp(approve, t.rot); st.classList.add('hit'); blank.querySelector('.stampzone').appendChild(st);
  SND.thud(); vib(30);
  setTimeout(() => {
    if (coin) { G.coins++; G.earned++; renderCoins('new', 1); SND.coin(); }
    renderBar();
    if (reason) strike(reason, reason === 'count' ? `Вагонів ${t.n}, а не ${x}.` : null);
  }, 420);
  setTimeout(() => { blank.classList.add('out'); SND.clack(); }, 1150);
  setTimeout(() => nextTrain(), 1650);
}
function endShift(){
  G.over = true; G.busy = true; clearTimeout(G.billT); renderBar();
  whenIdle(() => {
    $('dark').classList.add('on'); SND.whistle();
    setTimeout(() => { showFinal(); $('dark').classList.remove('on'); }, 2300);
  });
}

/* ---------- final ---------- */
function showFinal(){
  $('game').classList.remove('on');
  const f = $('final'); f.classList.add('on');
  const approved = G.archive.filter(t => t.result === 'ok').length;
  const pplBlanks = G.archive.filter(t => t.result === 'ok' && t.peopleW > 0);
  const bonusOk = G.strikes <= P.bonusMax && P.bonus > 0;
  const status = G.fired ? 'звільнено' : 'на службі';
  const w = G.signedW, pp = G.signedP;
  const truth = w > 0
    ? `${esc(G.name)}, ви відправили на страту <em>${fmt(pp)}</em> ${plural(pp,'людину','людини','людей')} у&nbsp;<em>${w}</em> ${plural(w,'товарному вагоні','товарних вагонах','товарних вагонах')}.`
    : `${esc(G.name)}, ви не підписали жодного вагона з людьми.`;
  const chance = w > 0 ? '<p class="truth f" data-d="3600">У вас була можливість відхилити запит, але ви цього не зробили.</p>' : '';
  f.innerHTML =
   `<div class="report paper f" data-d="0">
      <h2>ЗМІНУ ЗАВЕРШЕНО</h2>
      <div class="ln"><span>Диспетчер</span><b>Dysp. ${esc(G.name)}</b></div>
      <div class="ln"><span>Потягів схвалено</span><b>${approved} з ${P.trains}</b></div>
      <div class="ln"><span>Зароблено</span><b>${fmt(G.earned*10)} zł</b></div>
      ${bonusOk ? `<div class="ln"><span>Премія за сумлінну службу</span><b>+${fmt(P.bonus*10)} zł</b></div>` : ''}
      <div class="ln"><span>Доган</span><b>${G.strikes}</b></div>
      <div class="ln"><span>Статус</span><b>${status}</b></div>
    </div>
    <p class="truth f" data-d="2600">${truth}</p>
    ${chance}
    <div class="f" data-d="4400">
      ${pplBlanks.length ? `<button class="again archbtn" id="archbtn">ПІДПИСАНІ БЛАНКИ З ЛЮДЬМИ НА СТРАТУ <span>${pplBlanks.length}</span></button>` : ''}
      <h3 class="hh">Історична довідка</h3>
      <ol class="hist">
        <li>Walter Stier складав розклади цих потягів. Він не бачив, куди вони їхали: сидів у Кракові й Варшаві, за своїм столом. У&nbsp;1985 році він сказав: <strong class="q">«Я був лише бюрократом».</strong></li>
        <li>Потяги по 50–60 вагонів спершу зупинялися в Małkinia. Звідти їх по 20 вагонів відводили на бічну колію.</li>
        <li>У таборі, куди вела ця колія, вбили приблизно 925&nbsp;000 євреїв, а також невідому кількість ромів, поляків і військовополонених.</li>
      </ol>
      <h4 class="sh">Джерело для ознайомлення</h4>
      <ul class="src">
        <li><a href="https://uk.wikipedia.org/wiki/%D0%A2%D1%80%D0%B5%D0%B1%D0%BB%D1%96%D0%BD%D0%BA%D0%B0" target="_blank" rel="noopener">Вікіпедія — Треблінка</a></li>
      </ul>
      <button class="again" id="again">НОВА ЗМІНА</button>
    </div>`;
  const ab = $('archbtn');
  if (ab) ab.addEventListener('click', () => {
    const arch = $('arch'); arch.innerHTML = '';
    pplBlanks.forEach(t => arch.appendChild(renderBlank(t, true)));
    $('archov').classList.add('on'); arch.scrollTop = 0;
  });
  $('again').addEventListener('click', () => { const u = new URL(location.href); u.searchParams.delete('seed'); location.href = u.toString(); });
  f.querySelectorAll('.f').forEach(el => setTimeout(() => el.classList.add('on'), +el.dataset.d + 60));
}

/* ---------- start ---------- */
$('rules').innerHTML = [
  'Рахуйте вагони за списком: <b>у колонці «№» бувають пропуски.</b>',
  'Введіть точну кількість і поставте штамп.',
  `Ліміт станції — ${P.limit} вагонів. <b>Прибуття понад ліміт відхиляйте.</b>`,
  `Помилка — догана. ${(['','Одна догана','Дві догани','Три догани','Чотири догани','П\'ять доган'][P.strikes]) || (P.strikes + ' ' + plural(P.strikes,'догана','догани','доган'))} — звільнення. Схвалений потяг — 10 zł.`
].map(s => `<li>${s}</li>`).join('');

$('go').addEventListener('click', () => {
  G.name = ($('name').value.trim() || 'Walter Stier').slice(0, 22);
  ac();
  $('start').classList.remove('on'); $('game').classList.add('on');
  renderCoins(); renderSlots();
  nextTrain(); scheduleBill();
});
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
$('minus').addEventListener('click', () => { if (G.busy) return; G.count = Math.max(0, G.count-1); renderBar(); });
$('plus').addEventListener('click', () => { if (G.busy) return; G.count = Math.min(P.cars + 3, G.count+1); renderBar(); });
$('ok').addEventListener('click', () => decide(true));
$('archx').addEventListener('click', () => $('archov').classList.remove('on'));
$('no').addEventListener('click', () => decide(false));
})();
</script>
</body>
</html>
